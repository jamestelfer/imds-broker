# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - id: release
    binary: imds-broker
    main: ./cmd/imds-broker
    flags:
      - "-trimpath"
    ldflags: "-w -X main.version={{.Version}}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

checksum:
  name_template: "checksums.txt"

archives:
  - id: archives
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  use: github-native
  sort: asc

release:
  draft: true # leave as draft; the wrapper un-drafts after attestation
  mode: keep-existing # fill the release-please draft, don't replace it
  use_existing_draft: true # REQUIRED: lets GetReleaseByTag find the still-draft release
  prerelease: auto # mark prerelease from a semver pre-release tag

homebrew_casks:
  - name: imds-broker
    directory: Casks
    homepage: "https://github.com/jamestelfer/imds-broker"
    description: "AWS IMDSv2-compatible credential server for local development and CI"
    url:
      verified: "github.com/jamestelfer/imds-broker"
    repository:
      owner: jamestelfer
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_GITHUB_TOKEN }}"
    binaries:
      - imds-broker
    # skip publishing the cask on a prerelease. release.prerelease: auto only
    # marks the RELEASE as prerelease — it does NOT gate the cask push.
    skip_upload: auto
    # remove the macOS quarantine xattr so the binary runs without a Gatekeeper
    # prompt after `brew install`.
    hooks:
      post:
        install: |
          if OS.mac?
            system "xattr", "-dr", "com.apple.quarantine", "#{staged_path}/imds-broker"
          end
