# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - id: release
    binary: imds-broker
    main: ./cmd/imds-broker
    flags:
      - "-trimpath"
    ldflags: "-w -X main.version={{.Version}}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

checksum:
  name_template: "checksums.txt"

archives:
  - id: archives
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  use: github-native
  sort: asc

release:
  draft: true # leave as draft; the wrapper un-drafts after attestation
  mode: keep-existing # fill the release-please draft, don't replace it
  use_existing_draft: true # REQUIRED: lets GetReleaseByTag find the still-draft release
  prerelease: auto # mark prerelease from a semver pre-release tag

homebrew_casks:
  - name: imds-broker
    directory: Casks
    homepage: "https://github.com/jamestelfer/imds-broker"
    description: "AWS IMDSv2-compatible credential server for local development and CI"
    repository:
      owner: jamestelfer
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_GITHUB_TOKEN }}"
    binaries:
      - imds-broker
    # skip publishing the cask on a prerelease. release.prerelease: auto only
    # marks the RELEASE as prerelease — it does NOT gate the cask push.
    skip_upload: auto
    # hooks.post.install emits the `postflight` stanza, which Homebrew has
    # deprecated in favour of `postflight_steps`. custom_block carries the step
    # until goreleaser ships hooks.post.install_steps (goreleaser/goreleaser#6873).
    # `{{ "{{staged_path}}" }}` escapes Homebrew's `{{staged_path}}` token past
    # goreleaser's template pass over the rendered cask.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/imds-broker"]
        end
      end
